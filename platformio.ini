; Wilduino -- PlatformIO project configuration
;
; Three environments:
;   tag      -- animal-borne logger (battery, deep sleep)
;   station  -- stationary reference (mains, adds TSL2591)
;   native   -- host-side unit tests, no hardware required
;
; The native environment is the point of using PlatformIO rather than the
; Arduino IDE: pure logic (record packing, gain-ratio arithmetic, pressure
; conversion) compiles and runs on your laptop and in CI, so it is tested
; on every push without a board attached.
;
; Usage:
;   pio run -e tag                 build tag firmware
;   pio run -e tag -t upload       flash it
;   pio test -e native             run host tests
;   pio device monitor             serial console

[platformio]
default_envs = tag
src_dir = src
test_dir = test


; ------------------------------------------------------------------
; Shared settings
; ------------------------------------------------------------------
[env]
; Pin the platform version. An unpinned toolchain is not reproducible,
; which is how the 2020 codebase became unbuildable.
platform = atmelavr@~5.0.0
framework = arduino
board = miniwireless
board_build.f_cpu = 16000000L

monitor_speed = 9600

; -Os for size: flash is 31.5 KB and it is the binding constraint.
; -Wall -Wextra because on a 2 KB device the compiler catches things
; that would otherwise be a field failure.
build_flags =
    -Os
    -Wall
    -Wextra
    -ffunction-sections
    -fdata-sections

build_unflags =
    -std=gnu++11

; Dependencies pinned to exact versions. Update deliberately, never
; incidentally. (Equivalent in spirit to renv::snapshot() in R.)
lib_deps =
    ; SdFat is smaller and faster than the bundled SD library, and
    ; supports the sustained writes the weekly archive dump needs.
    greiman/SdFat@^2.2.2
    ; LowPower gives the sleep primitives; tiny and stable.
    lowpowerlab/LowPower_LowPowerLab@^2.2.0

; Static analysis. Run with: pio check
check_tool = cppcheck
check_flags = --enable=warning,style,performance


; ------------------------------------------------------------------
; Tag: animal-borne
; ------------------------------------------------------------------
[env:tag]
build_flags =
    ${env.build_flags}
    -D WILDUINO_VARIANT_TAG
    -D WILDUINO_HAS_GPS=1
    -D WILDUINO_HAS_BARO=1
    -D WILDUINO_HAS_ACCEL_WAKE=1
    -D WILDUINO_HAS_LIGHT=0


; ------------------------------------------------------------------
; Station: stationary reference
; ------------------------------------------------------------------
[env:station]
build_flags =
    ${env.build_flags}
    -D WILDUINO_VARIANT_STATION
    -D WILDUINO_HAS_GPS=1
    -D WILDUINO_HAS_BARO=1
    -D WILDUINO_HAS_ACCEL_WAKE=0
    -D WILDUINO_HAS_LIGHT=1


; ------------------------------------------------------------------
; Native: host-side unit tests
; ------------------------------------------------------------------
; No board, no framework. Only pure logic compiles here, so keep
; hardware-dependent code behind interfaces that can be stubbed.
[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -D WILDUINO_NATIVE_TEST
lib_deps =
